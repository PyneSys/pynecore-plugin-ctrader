[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "pynecore_ctrader" = "src/pynecore_ctrader" }
packages.find = { where = ["src"] }

[project]
name = "pynesys-pynecore-ctrader"
version = "0.9.4"
description = "cTrader Open API integration for PyneCore (multi-broker)"
authors = [{ name = "PYNESYS LLC", email = "hello@pynesys.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pynesys-pynecore>=6.7.0", "protobuf>=6.31.1", "httpx"]

[project.urls]
"Homepage" = "https://pynecore.org"
"Repository" = "https://github.com/PyneSys/pynecore-plugin-ctrader"
"Documentation" = "https://pynecore.org/docs"
"Issues" = "https://github.com/PyneSys/pynecore-plugin-ctrader/issues"

# Social
"X" = "https://x.com/pynesys"
"Discord" = "https://discord.com/invite/jegnhtq6gy"

[project.entry-points."pyne.plugin"]
ctrader = "pynecore_ctrader:CTrader"

[project.optional-dependencies]
dev = ["grpcio-tools", "types-protobuf"]
