[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "pynecore_ctrader" = "src/pynecore_ctrader" }
packages.find = { where = ["src"] }

[project]
name = "pynesys-pynecore-ctrader"
version = "0.1.0"
description = "cTrader Open API integration for PyneCore (multi-broker)"
authors = [{ name = "PYNESYS LLC", email = "hello@pynesys.com" }]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pynesys-pynecore>=6.5", "protobuf", "httpx"]

[project.entry-points."pyne.plugin"]
ctrader = "pynecore_ctrader:CTrader"

[project.optional-dependencies]
dev = ["grpcio-tools", "types-protobuf"]
